name: Daily Sync

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  daily-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Install OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ocr-py/uv.lock

      - name: Setup Python
        run: uv python install 3.13
        working-directory: ocr-py

      - name: Install Python dependencies
        run: uv sync
        working-directory: ocr-py

      - name: Run daily OCR sync
        run: uv run main.py --daily
        working-directory: ocr-py
